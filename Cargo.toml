[package]
name = "async-walkdir"
version = "2.2.0"
authors = ["Ririsoft <riri@ririsoft.com>"]
edition = "2021"
description = "Asynchronous directory traversal for Rust."
license = "Apache-2.0"
keywords = ["async", "walk", "directory", "recursive", "stream"]
categories = ["asynchronous", "filesystem"]
homepage = "https://github.com/ririsoft/async-walkdir"
repository = "https://github.com/ririsoft/async-walkdir"
documentation = "https://docs.rs/async-walkdir/"
exclude = [ "/.github/*" ]
readme = "README.md"

[features]
# Experimental walker resistant to symlink races, see the `secure` module (Unix and Windows).
secure = ["dep:blocking", "dep:rustix", "dep:windows-sys"]

[dependencies]
futures-lite = "2.6"
async-fs = "2.2"
thiserror = "2.0"
blocking = { version = "1.6", optional = true }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", features = ["fs"], optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", optional = true, features = [
    "Wdk_Foundation",
    "Wdk_Storage_FileSystem",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
] }

[dev-dependencies]
tempfile = "3.27"
tokio = { version = "1.53", features = ["rt-multi-thread"] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
